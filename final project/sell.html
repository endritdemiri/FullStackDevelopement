<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell Your Car</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<a href="index.html" class="back-btn">← Back</a>

<div class="sell-container">

    <h1>Sell Your Car</h1>
    <p class="subtitle">List your car and reach buyers بسهولة</p>

    <form class="sell-form">

        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="text" placeholder="Phone Number" required>

        <input type="text" placeholder="Car Brand (BMW, Audi...)" required>
        <input type="text" placeholder="Model (M4, A4...)" required>
        <input type="number" placeholder="Year" required>
        <input type="text" placeholder="Mileage (km)" required>
        <input type="text" placeholder="Price (€)" required>

        <textarea placeholder="Car Description"></textarea>

        <button type="submit">Submit Listing</button>

    </form>

</div>

</body>
</html>
